<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" fill="#2250CF" rx="60"/>
  
  <!-- K Letter -->
  <g transform="translate(128, 128)">
    <!-- Vertical line of K -->
    <rect x="-20" y="-60" width="16" height="120" fill="white" rx="8"/>
    
    <!-- Top diagonal of K -->
    <rect x="-4" y="-40" width="16" height="70" fill="white" rx="8" transform="rotate(45 0 0)"/>
    
    <!-- Bottom diagonal of K -->
    <rect x="-4" y="0" width="16" height="70" fill="white" rx="8" transform="rotate(-45 0 0)"/>
  </g>
</svg>